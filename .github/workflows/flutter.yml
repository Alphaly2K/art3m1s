name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      artemis_v2:
        description: Build the macOS Artemis v2 preview
        type: boolean
        default: false
      artemis_v2_shaders:
        description: Build the Artemis v2 preview with DXVK and the HLSL compiler (macOS 15+)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: art3m1s
    env:
      CORE_SRC: ${{ github.workspace }}/art3m1s-core
    steps:
      - name: Checkout art3m1s-core
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/art3m1s-core
          ref: master
          path: art3m1s-core
          submodules: recursive
      - name: Checkout RFVP dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/rfvp
          path: rfvp
      - name: Checkout Siglus dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/siglus_rs
          path: siglus_rs
      - name: Checkout Art3m1s
        uses: actions/checkout@v4
        with:
          path: art3m1s
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Flutter Host
        run: |
          report="$RUNNER_TEMP/flutter-analysis.txt"
          if ! flutter analyze --no-pub --write="$report"; then
            if [[ -s "$report" ]]; then
              awk 'NR <= 12 && NF {
                gsub(/%/, "%25"); gsub(/\r/, "%0D");
                print "::error title=Flutter analyzer::" $0
              }' "$report"
            fi
            exit 1
          fi
      - name: Test Flutter Host
        run: |
          report="$RUNNER_TEMP/flutter-tests.json"
          if ! flutter test --no-pub --file-reporter "json:$report"; then
            python3 - "$report" <<'PYTHON'
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys

          report = Path(sys.argv[1])
          tracked = set(subprocess.check_output(['git', 'ls-files', 'test'], text=True).splitlines())
          suites, tests, failed = {}, {}, set()
          if report.is_file():
              for line in report.read_text().splitlines():
                  event = json.loads(line)
                  if event['type'] == 'suite':
                      suites[event['suite']['id']] = event['suite'].get('path')
                  elif event['type'] == 'testStart':
                      tests[event['test']['id']] = event['test']['suiteID']
                  elif event['type'] == 'testDone' and event['result'] != 'success':
                      failed.add(event['testID'])

          paths = {suites.get(tests.get(test)) for test in failed}
          for path in sorted(p for p in paths if p):
              relative = Path(path)
              if relative.is_absolute():
                  try:
                      relative = relative.relative_to(Path.cwd())
                  except ValueError:
                      continue
              name = relative.as_posix()
              if name in tracked and re.fullmatch(r'test/[a-zA-Z0-9_/]+_test\.dart', name):
                  print(f'::error file={name}::Tests failed in {name}')
          PYTHON
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout art3m1s-core
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/art3m1s-core
          ref: master
          path: art3m1s-core
          submodules: recursive
      - name: Checkout RFVP dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/rfvp
          path: rfvp
      - name: Checkout Siglus dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/siglus_rs
          path: siglus_rs
      - name: Checkout Art3m1s
        uses: actions/checkout@v4
        with:
          path: art3m1s
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android APK
        working-directory: art3m1s
        env:
          CORE_SRC: ${{ github.workspace }}/art3m1s-core
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: dart run tool/build.dart android --release --siglus
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Art3m1s-android-arm64
          path: art3m1s/build/app/outputs/flutter-apk/app-release.apk

  apple:
    runs-on: ${{ inputs.artemis_v2_shaders && 'macos-15' || 'macos-latest' }}
    steps:
      - name: Checkout art3m1s-core
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/art3m1s-core
          ref: master
          path: art3m1s-core
          submodules: recursive
      - name: Checkout RFVP dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/rfvp
          path: rfvp
      - name: Checkout Siglus dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/siglus_rs
          path: siglus_rs
      - name: Checkout Art3m1s
        uses: actions/checkout@v4
        with:
          path: art3m1s
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: art3m1s/.build/ffmpeg-ios
          key: ffmpeg-ios-8.1.2-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test native host services
        working-directory: art3m1s
        run: bash tool/native_host_tests/run.sh
      - name: Build macOS Artemis v2 shader runtime
        if: ${{ inputs.artemis_v2_shaders }}
        working-directory: art3m1s-core
        run: |
          brew install bison glslang make meson ninja pkg-config sdl3
          export PATH="$(brew --prefix bison)/bin:$PATH"
          shader_dir="$RUNNER_TEMP/artemis-shaders"
          bash scripts/build-host-shaders-macos.sh "$shader_dir"
          {
            printf 'ARTEMIS_V2_DXVK_RUNTIME_DIR=%s/dxvk\n' "$shader_dir"
            printf 'ARTEMIS_V2_HLSL_COMPILER_DIR=%s/hlsl\n' "$shader_dir"
          } >> "$GITHUB_ENV"
      - name: Build macOS
        working-directory: art3m1s
        env:
          CORE_SRC: ${{ github.workspace }}/art3m1s-core
          ARTEMIS_V2_PREVIEW: ${{ inputs.artemis_v2 || inputs.artemis_v2_shaders }}
        run: |
          if [[ "$ARTEMIS_V2_PREVIEW" == true ]]; then
            dart run tool/build.dart macos --release --siglus --artemis-v2
          else
            dart run tool/build.dart macos --release --siglus
          fi
      - name: Build iOS
        working-directory: art3m1s
        env:
          CORE_SRC: ${{ github.workspace }}/art3m1s-core
        run: dart run tool/build.dart ios --release --device-only --siglus
      - name: Upload macOS app
        if: ${{ !inputs.artemis_v2 && !inputs.artemis_v2_shaders }}
        uses: actions/upload-artifact@v4
        with:
          name: Art3m1s-macos-arm64
          path: art3m1s/build/macos/Build/Products/Release/*.app
      - name: Archive macOS Artemis v2 preview
        if: ${{ inputs.artemis_v2 || inputs.artemis_v2_shaders }}
        working-directory: art3m1s
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/art3m1s.app build/Art3m1s-macos-arm64-artemis-v2.zip
      - name: Verify macOS Artemis v2 preview archive
        if: ${{ inputs.artemis_v2 || inputs.artemis_v2_shaders }}
        working-directory: art3m1s
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          bash tool/verify_artemis_v2_archive.sh \
            build/Art3m1s-macos-arm64-artemis-v2.zip "${{ github.workspace }}/art3m1s-core" --compile-only
      - name: Upload macOS Artemis v2 preview
        if: ${{ inputs.artemis_v2 || inputs.artemis_v2_shaders }}
        uses: actions/upload-artifact@v4
        with:
          name: Art3m1s-macos-arm64-artemis-v2
          path: art3m1s/build/Art3m1s-macos-arm64-artemis-v2.zip
          if-no-files-found: error
      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Art3m1s-ios-arm64
          path: art3m1s/build/ios-native/DerivedData/Build/Products/Release-iphoneos/Art3m1sNative.app
