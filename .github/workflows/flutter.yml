name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      artemis_v2:
        description: Build the macOS Artemis v2 preview
        type: boolean
        default: false
      artemis_v2_shaders:
        description: Bundle DXVK and the HLSL compiler (v2 selected on macOS 15+)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: art3m1s
    env:
      CORE_SRC: ${{ github.workspace }}/art3m1s-core
    steps:
      - name: Checkout art3m1s-core
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/art3m1s-core
          ref: master
          path: art3m1s-core
          submodules: recursive
      - name: Checkout RFVP dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/rfvp
          path: rfvp
      - name: Checkout Siglus dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/siglus_rs
          ref: 7fc5c64b0454506d69ce08549035c813fe22f85b
          path: siglus_rs
      - name: Checkout Art3m1s
        uses: actions/checkout@v4
        with:
          path: art3m1s
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Flutter Host
        run: flutter analyze --no-pub
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build PFS library for Flutter tests
        run: |
          cargo build --locked --manifest-path "$CORE_SRC/crates/pfs-upk-rust/Cargo.toml" \
            --target-dir "$RUNNER_TEMP/flutter-pfs"
      - name: Test Flutter Host
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/flutter-pfs/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          flutter test --no-pub

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout art3m1s-core
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/art3m1s-core
          ref: master
          path: art3m1s-core
          submodules: recursive
      - name: Checkout RFVP dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/rfvp
          path: rfvp
      - name: Checkout Siglus dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/siglus_rs
          ref: 7fc5c64b0454506d69ce08549035c813fe22f85b
          path: siglus_rs
      - name: Checkout Art3m1s
        uses: actions/checkout@v4
        with:
          path: art3m1s
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android APK
        working-directory: art3m1s
        env:
          CORE_SRC: ${{ github.workspace }}/art3m1s-core
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: dart run tool/build.dart android --release --siglus
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Art3m1s-android-arm64
          path: art3m1s/build/app/outputs/flutter-apk/app-release.apk

  apple:
    runs-on: ${{ (github.event_name == 'push' || inputs.artemis_v2_shaders) && 'macos-15' || 'macos-latest' }}
    env:
      ARTEMIS_V2_SHADERS: ${{ github.event_name == 'push' || inputs.artemis_v2_shaders }}
      ARTEMIS_V2_PREVIEW: ${{ inputs.artemis_v2 }}
    steps:
      - name: Checkout art3m1s-core
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/art3m1s-core
          ref: master
          path: art3m1s-core
          submodules: recursive
      - name: Checkout RFVP dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/rfvp
          path: rfvp
      - name: Checkout Siglus dependency
        uses: actions/checkout@v4
        with:
          repository: Alphaly2K/siglus_rs
          ref: 7fc5c64b0454506d69ce08549035c813fe22f85b
          path: siglus_rs
      - name: Checkout Art3m1s
        uses: actions/checkout@v4
        with:
          path: art3m1s
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: art3m1s/.build/ffmpeg-ios
          key: ffmpeg-ios-8.1.2-${{ runner.os }}-${{ runner.arch }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test native host services
        working-directory: art3m1s
        run: bash tool/native_host_tests/run.sh
      - name: Build macOS Artemis v2 shader runtime
        if: ${{ env.ARTEMIS_V2_SHADERS == 'true' }}
        working-directory: art3m1s-core
        run: |
          brew install bison cmake glslang make meson ninja pkg-config
          export PATH="$(brew --prefix bison)/bin:$PATH"
          shader_dir="$RUNNER_TEMP/artemis-shaders"
          bash scripts/build-host-shaders-macos.sh "$shader_dir"
          {
            printf 'ARTEMIS_V2_DXVK_RUNTIME_DIR=%s/dxvk\n' "$shader_dir"
            printf 'ARTEMIS_V2_HLSL_COMPILER_DIR=%s/hlsl\n' "$shader_dir"
          } >> "$GITHUB_ENV"
      - name: Build macOS
        id: build_macos
        working-directory: art3m1s
        env:
          CORE_SRC: ${{ github.workspace }}/art3m1s-core
        run: |
          if [[ "$ARTEMIS_V2_PREVIEW" == true ]]; then
            dart run tool/build.dart macos --release --siglus --artemis-v2
          else
            dart run tool/build.dart macos --release --siglus
          fi
      - name: Upload macOS app
        if: ${{ env.ARTEMIS_V2_SHADERS != 'true' && env.ARTEMIS_V2_PREVIEW != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Art3m1s-macos-arm64
          path: art3m1s/build/macos/Build/Products/Release/*.app
      - name: Archive macOS Artemis v2 app
        if: ${{ env.ARTEMIS_V2_SHADERS == 'true' || env.ARTEMIS_V2_PREVIEW == 'true' }}
        working-directory: art3m1s
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/art3m1s.app build/Art3m1s-macos-arm64-artemis-v2.zip
      - name: Verify macOS Artemis v2 archive
        if: ${{ env.ARTEMIS_V2_SHADERS == 'true' || env.ARTEMIS_V2_PREVIEW == 'true' }}
        working-directory: art3m1s
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          bash tool/verify_artemis_v2_archive.sh \
            build/Art3m1s-macos-arm64-artemis-v2.zip "${{ github.workspace }}/art3m1s-core" --compile-only
      - name: Upload macOS Artemis v2 archive
        if: ${{ env.ARTEMIS_V2_SHADERS == 'true' || env.ARTEMIS_V2_PREVIEW == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'Art3m1s-macos-arm64' || 'Art3m1s-macos-arm64-artemis-v2' }}
          path: art3m1s/build/Art3m1s-macos-arm64-artemis-v2.zip
          if-no-files-found: error
      - name: Build iOS
        id: build_ios
        if: ${{ !cancelled() && steps.build_macos.outcome == 'success' }}
        working-directory: art3m1s
        env:
          CORE_SRC: ${{ github.workspace }}/art3m1s-core
        run: dart run tool/build.dart ios --release --device-only --siglus
      - name: Upload iOS app
        if: ${{ !cancelled() && steps.build_ios.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Art3m1s-ios-arm64
          path: art3m1s/build/ios-native/DerivedData/Build/Products/Release-iphoneos/Art3m1sNative.app
